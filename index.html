<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    .split-container {
      display: flex;
      height: 100vh;
    }

    .left-side {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slider {
      height: 100%;
      width: 100%;
      position: relative;
    }

    .slider-img {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      object-fit: cover;
      filter: blur(2px);
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slider-img.active {
      opacity: 1;
    }

    .slider-heading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transition: opacity 1s ease-in-out, transform 1s ease-in-out;
    }

    .slider-heading.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .right-side {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to right, #4e54c8, #8f94fb);
      padding: 20px;
    }

    .login-card {
      background: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #4e54c8;
    }

    .toggle-password {
      cursor: pointer;
      position: absolute;
      top: 35%;
      right: 15px;
      color: #888;
    }

    #errorMsg {
      animation: shake 0.3s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .split-container {
        flex-direction: column;
      }
      .left-side {
        height: 250px;
      }
      .slider-heading {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="split-container">
    <!-- Left Side with Slider -->
    <div class="left-side">
      <div class="slider">
        <img src="assets/img/lock-01.png" class="slider-img active" alt="Slide 1">
        <img src="assets/img/lock-02.png" class="slider-img" alt="Slide 2">
        <img src="assets/img/lock-03.png" class="slider-img" alt="Slide 3">
      </div>
      <div id="headings">
        <div class="slider-heading active">Welcome to Our PE Teacher Course</div>
        <div class="slider-heading">دبلوم اعداد معلمي ومعلمات التربية البدنية.</div>
        <div class="slider-heading">Welcome to Our PE Teacher Course</div>
      </div>
    </div>

    <!-- Right Login Form Side -->
    <div class="right-side">
      <div class="login-card text-center">
        <h3 class="mb-4 text-primary">🔐 Login</h3>
        <form id="loginForm">
          <div class="form-group">
            <input type="text" id="username" class="form-control" placeholder="Username" required>
          </div>
          <div class="form-group position-relative">
            <input type="password" id="password" class="form-control" placeholder="Password" required>
            <span class="toggle-password" onclick="togglePassword()">👁️</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
          <div id="errorMsg" class="mt-3 text-danger font-weight-bold"></div>
        </form>
      </div>
    </div>
  </div>
  <!-- Footer Section -->
<footer class="footer-contact">
  <a href="https://wa.me/8801761482306?text=I%20have%20come%20from%20the%20pediplome%20website%20to%20contact%20you:%0A%0A%0A%0A"
     target="_blank"
     class="simple-contact-btn">
      Design and Developed by © ASHIKUR RAHMAN.
  </a>
</footer>

<style>
  .footer-contact {
    width: 100%;
    padding: 10px 0;
    text-align: center;
    background: linear-gradient(270deg,
      rgba(102, 153, 255, 0.8),
      rgba(204, 153, 255, 0.8),
      rgba(153, 204, 255, 0.8),
      rgba(255, 204, 204, 0.8)
    );
    background-size: 800% 800%;
    animation: gradientShift 6s ease infinite;
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 999;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
  }

  .simple-contact-btn {
    color: black;
    font-weight: bold;
    font-size: 16px;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .simple-contact-btn:hover {
    text-decoration: underline;
    color: white;
  }
</style>


  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const icon = document.querySelector('.toggle-password');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        icon.textContent = '👁️';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (username === 'Abbe1970' && password === 'AbuSekh1255') {
        localStorage.setItem('loggedIn', 'true');
        window.location.href = 'course.html';
      } else {
        errorMsg.innerText = '❌ Invalid username or password!';
        errorMsg.style.animation = 'shake 0.3s';
        setTimeout(() => errorMsg.style.animation = '', 300);
      }
    });

    // Slider & Heading Sync
    let currentIndex = 0;
    const slides = document.querySelectorAll('.slider-img');
    const headings = document.querySelectorAll('.slider-heading');

    setInterval(() => {
      // Remove active from current slide and heading
      slides[currentIndex].classList.remove('active');
      headings[currentIndex].classList.remove('active');

      // Move to next
      currentIndex = (currentIndex + 1) % slides.length;

      // Add active to new slide and heading
      slides[currentIndex].classList.add('active');
      headings[currentIndex].classList.add('active');
    }, 4000); // every 4 seconds
  </script>

</body>
</html>
